# Ref: https://securitylab.github.com/research/github-actions-preventing-pwn-requests
name: Breakage

# read-only repo token
# no access to secrets
on:
  pull_request:

jobs:
  break:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [
          "JuliaMath/MeasureTheory.jl"
        ]
        pkgversion: [latest, stable]

    steps:
      - uses: actions/checkout@v7

      # Install Julia
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: x64
      - uses: actions/cache@v6
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - name: Install development dependency
        run: julia --project=. .github/prepare-dev-deps.jl
      - uses: julia-actions/julia-buildpkg@v1

      # Breakage test
      - name: 'Breakage of ${{ matrix.pkg }}, ${{ matrix.pkgversion }} version'
        id: downstream
        env:
          URL: ${{ matrix.pkg }}
          VERSION: ${{ matrix.pkgversion }}
        run: |
          git clone "https://github.com/$URL" downstream
          cd downstream
          if [ "$VERSION" = stable ]; then
            tag=$(git tag -l 'v*' --sort=-creatordate | head -n1)
            test -n "$tag"
            git checkout "$tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
          julia --project=.. ../.github/check-downstream.jl

      - name: Record downstream result
        if: ${{ !cancelled() }}
        env:
          URL: ${{ matrix.pkg }}
          VERSION: ${{ matrix.pkgversion }}
          TAG: ${{ steps.downstream.outputs.tag || matrix.pkgversion }}
          OUTCOME: ${{ steps.downstream.outcome }}
        run: |
          mkdir -p pr
          badge=Fail-red
          if [ "$OUTCOME" = success ]; then badge=Pass-green; fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf '[![](https://img.shields.io/badge/%s-%s)](%s)' "$TAG" "$badge" "$run_url" > "pr/${URL##*/}-$VERSION"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: downstream-${{ strategy.job-index }}
          path: pr/

  upload:
    needs: break
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: downstream-*
          merge-multiple: true
          path: pr/

      - name: Render downstream report
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          cd pr
          echo "$PR_NUMBER" > NR
          {
            echo '| Package name | latest | stable |'
            echo '|--|--|--|'
            for file in *-latest *-stable; do
              if [ -f "$file" ]; then echo "${file%-*}"; fi
            done | sort -u | while IFS= read -r pkg; do
              printf '| %s ' "$pkg"
              for version in latest stable; do
                printf '| '
                if [ -s "$pkg-$version" ]; then cat "$pkg-$version"; else printf 'Missing result'; fi
                printf ' '
              done
              echo '|'
            done
          } > MSG

      - uses: actions/upload-artifact@v7
        with:
          name: pr
          path: pr/
